{% extends "base.html" %}


{% block title %}
Export Complete — ComicCraft
{% endblock %}


{% block content %}


<section class="success">

    <div class="success-icon">
        ✓
    </div>


    <p class="eyebrow">
        Export complete
    </p>


    <h1>
        Your comic is ready.
    </h1>


    <p>
        The PDF was generated successfully.
        You can save, print, or share it.
    </p>


    <a
        class="primary link-button"
        href="/"
    >
        Go Create Another Comic
    </a>

</section>


{% endblock %}
